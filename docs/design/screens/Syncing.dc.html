<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BACI — Syncing your accounts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;color:#16181D;background:#F5F3EE}
a{color:#0F5C4C}a:hover{color:#0B4A3D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F3EE; padding: 16px 16px 20px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; gap: 6px; padding-top: 56px">
<div style="flex-grow: 1; height: 4px; border-radius: 4px; background: #0F5C4C"></div>
<div style="flex-grow: 1; height: 4px; border-radius: 4px; background: #0F5C4C"></div>
<div style="flex-grow: 1; height: 4px; border-radius: 4px; background: #0F5C4C"></div>
<div style="flex-grow: 1; height: 4px; border-radius: 4px; background: #0F5C4C"></div>
<div style="flex-grow: 1; height: 4px; border-radius: 4px; background: #E1DDD3"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 28px; line-height: 1.15">Syncing Harbour Bank</h1>
<p style="margin: 0; color: #5B606B; font-size: 15px">This usually takes a few seconds.</p>
</div>
<div style="background: #FFFFFF; border: 1px solid #E1DDD3; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="height: 8px; border-radius: 999px; background: #EFECE5; overflow: hidden" role="progressbar" aria-label="Sync progress" aria-valuenow="{{pct}}" aria-valuemin="0" aria-valuemax="100"><div style="height: 100%; width: {{pctWidth}}; background: #0F5C4C; border-radius: 999px"></div></div>
<sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
<div style="display: flex; gap: 12px; align-items: center; color: {{s.colour}}">
<span style="width: 24px; height: 24px; border-radius: 50%; background: {{s.dot}}; border: {{s.ring}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #1D6B45; font-size: 13px; font-weight: 700">{{s.mark}}</span>
<span style="flex-grow: 1">{{s.label}}</span>
<span style="font-size: 12.5px; font-weight: 600">{{s.status}}</span>
</div>
</sc-for>
</div>
<div style="display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: #454A54">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 21a9 9 0 100-18 9 9 0 000 18z"/><path d="M12 11v5"/><path d="M12 7.8v.1"/></svg>
<span>Taking a while? You can carry on — we'll finish in the background and let you know when your first insight is ready.</span>
</div>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<a href="Connected.dc.html" style="height: 52px; border-radius: 999px; background: #0F5C4C; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center">{{ctaLabel}}</a>
<a href="SyncPartial.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; text-decoration: none">Preview: one account fails to sync</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"progress":{"editor":"range","min":0,"max":5,"step":1,"default":3},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const done = Math.max(0, Math.min(5, this.props.progress ?? 3));
const labels = ['Retrieving balances', 'Fetching 12 months of transactions', 'Categorising spending', 'Finding regular payments', 'Building your financial picture'];
const steps = labels.map((label, i) => {
const isDone = i < done;
const isNow = i === done;
return {
label: label,
status: isDone ? 'Done' : isNow ? 'In progress' : 'Waiting',
mark: isDone ? '✓' : '',
dot: isDone ? '#E2F1E8' : '#FFFFFF',
ring: isDone ? '0' : isNow ? '2px solid #0F5C4C' : '1.5px dashed #C9C4B8',
colour: isDone || isNow ? '#16181D' : '#5B606B'
};
});
const pct = Math.round((done / 5) * 100);
return { steps: steps, pct: pct, pctWidth: pct + '%', ctaLabel: done >= 5 ? 'See what we found' : 'Continue' };
}
}
</script>
</body>
</html>
